<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Walkthru · Homes in 3D, before they're built</title>
<meta name="description" content="Walk through the home before it's built.">
<meta property="og:type" content="website"><meta property="og:title" content="Walkthru · Homes in 3D, before they're built">
<meta property="og:description" content="Walk through the home before it's built."><meta property="og:image" content="/og.png">

<link rel="icon" href="/favicon.svg" type="image/svg+xml"><link rel="icon" href="/icon-96.png" type="image/png" sizes="96x96"><link rel="icon" href="/icon-32.png" type="image/png" sizes="32x32"><link rel="apple-touch-icon" href="/apple-icon.png" sizes="180x180">
<script>
  // Old links pointed at the app on the root URL (/#admin, /#c/<token>, /#my-design…). Send them to the playground.
  if (/^#(admin|c\/|house-|my-design)/.test(location.hash)) location.replace('/playground' + location.hash);
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap">
<style>
:root{--bg:#fafafa;--paper:#fff;--ink:#111114;--ink-2:#6b6b76;--ink-3:#9e9ea8;--rule:#e6e6ea;--primary:#111114;--primary-ink:#fff;--accent:#3b5bfd;
  --f-ui:"Inter",ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){--bg:#0c0c0e;--paper:#151518;--ink:#ececf0;--ink-2:#8e8e99;--ink-3:#5e5e68;--rule:#26262b;--primary:#ececf0;--primary-ink:#151518;--accent:#7088ff;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0c0c0e;--paper:#151518;--ink:#ececf0;--ink-2:#8e8e99;--ink-3:#5e5e68;--rule:#26262b;--primary:#ececf0;--primary-ink:#151518;--accent:#7088ff;color-scheme:dark}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;font-feature-settings:"cv11","ss01"}
a{color:inherit}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.wrap{width:100%;max-width:1200px;margin:0 auto;padding:0 24px}
.nav .wrap{display:flex;align-items:center;justify-content:space-between;height:64px}
.brand{display:flex;align-items:center;gap:9px;text-decoration:none;font-weight:600;font-size:15px;letter-spacing:-.01em}
.wt-mark{display:inline-block;flex:none;width:1.3em;height:1.3em;background:currentColor;-webkit-mask:url(/walkthru-mark.png) center/contain no-repeat;mask:url(/walkthru-mark.png) center/contain no-repeat}
.foot{margin-top:auto;border-top:1px solid var(--rule);padding:22px 0;color:var(--ink-2);font-size:13px}
.foot .wrap{display:flex;align-items:center;justify-content:space-between;gap:12px 24px;flex-wrap:wrap}
.foot .by{text-decoration:none}
.foot nav{display:flex;align-items:center;gap:18px;flex-wrap:wrap}.foot nav a{text-decoration:none}.foot nav a:hover,.foot .by:hover{color:var(--ink)}
.logo{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;background:var(--primary);color:var(--primary-ink)}
.logo svg{width:14px;height:14px}
.nav nav{display:flex;align-items:center;gap:6px}
.link{font-size:14px;color:var(--ink-2);text-decoration:none;padding:8px 10px}
.link:hover{color:var(--ink)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;font:500 14px/1 var(--f-ui);text-decoration:none;border-radius:9px;padding:11px 16px;border:1px solid transparent;transition:opacity .15s,border-color .15s;white-space:nowrap}
.btn-sm{padding:8px 13px;font-size:13.5px}
.btn-primary{background:var(--primary);color:var(--primary-ink)}
.btn-primary:hover{opacity:.88}
.btn-ghost{border-color:var(--rule);background:var(--paper);color:var(--ink)}
.btn-ghost:hover{border-color:var(--ink-3)}
.btn svg{width:14px;height:14px}

main{flex:1}
.hero{text-align:center;padding:36px 0 22px}
h1{font-size:clamp(36px,5.6vw,64px);line-height:1.03;letter-spacing:-.04em;font-weight:600;margin:0 auto;max-width:19ch;text-wrap:balance}
.film{margin:28px 0 56px;border-radius:14px;overflow:hidden;border:1px solid var(--rule);background:#0b0b0d;box-shadow:0 1px 2px rgba(16,16,24,.04),0 30px 60px -30px rgba(16,16,24,.35)}
.film video{display:block;width:100%;height:auto;aspect-ratio:16/9}
.trio{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin:0 0 80px}
.trio figure{margin:0;display:flex;flex-direction:column;gap:14px}
.trio .frame{aspect-ratio:1200/943;border-radius:14px;overflow:hidden;border:1px solid #26262b;background:#16161a;display:flex;align-items:center;justify-content:center}
.trio .frame img{display:block;width:86%;height:86%;object-fit:contain;object-position:center}
.trio figcaption{padding:0 2px;font-size:15px;line-height:1.4;color:var(--ink);text-wrap:balance}
.fin{width:100%;padding:14px 16px;color:#ececf0;font-size:12px;background:#16161a}
.fin h3{display:flex;justify-content:space-between;gap:8px;margin:8px 0 6px;font:500 12px/1.3 Inter,sans-serif}
.fin h3:first-child{margin-top:0}
.fin h3 span{font-weight:400;color:#8e8e99;text-align:right}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw b{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(255,255,255,.14)}
.sw b.on{box-shadow:0 0 0 2px #16161a,0 0 0 3.5px #ececf0}
.sw .wheel{background:conic-gradient(#e66,#ec6,#6c6,#6ce,#66e,#c6e,#e66)}

@media (max-width:820px){
  .hero{padding:28px 0 18px}
  .nav .link{display:none}
  .trio{grid-template-columns:1fr}
}
@media (max-width:480px){.wrap{padding:0 16px}}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

/* slim scrollbars everywhere: a thin rounded thumb, no track */
*{scrollbar-width:thin;scrollbar-color:rgba(128,128,140,.35) transparent}
*:hover{scrollbar-color:rgba(128,128,140,.6) transparent}
@supports selector(::-webkit-scrollbar){*{scrollbar-width:auto;scrollbar-color:auto}*:hover{scrollbar-color:auto}}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track,::-webkit-scrollbar-corner{background:transparent}
::-webkit-scrollbar-thumb{background:rgba(128,128,140,.35);border-radius:10px;border:3px solid transparent;background-clip:padding-box;min-height:32px}
::-webkit-scrollbar-thumb:hover{background:rgba(128,128,140,.6);background-clip:padding-box}
::-webkit-scrollbar-button{display:none}
</style>
</head>
<body>

<header class="nav">
  <div class="wrap">
    <a class="brand" href="/"><span class="wt-mark" aria-hidden="true"></span>Walkthru</a>
    <nav aria-label="Main">
      <a class="btn btn-primary btn-sm" href="/playground#admin">Start building</a>
    </nav>
  </div>
</header>

<main class="wrap">
  <section class="hero">
    <h1>Walk through the home before it's built.</h1>
  </section>

  <figure class="film"><video id="film" muted loop playsinline preload="metadata" poster="/media/walkthru.jpg" aria-label="The design agent building a three-storey home from one sentence, then a walk inside"><source src="https://res.cloudinary.com/dumbpanrc/video/upload/v1795847732/walkthru.mp4" type="video/mp4"></video></figure>

  <section class="trio" aria-label="What you can do">
    <figure>
      <div class="frame"><img src="/upload-plan.svg" alt="A floor plan drawing you can upload" width="640" height="460"></div>
      <figcaption>Upload floor plans and watch it build. Watch it build in real-time in front of you.</figcaption>
    </figure>
    <figure>
      <div class="frame"><img src="/home-plan-dark.jpg" alt="The same home as a floor plan you can drag around" width="1200" height="943"></div>
      <figcaption>Drag rooms, add furniture. It will auto configure.</figcaption>
    </figure>
    <figure>
      <div class="frame"><div class="fin" aria-hidden="true">
        <h3>Main walls <span>Stucco · White</span></h3>
        <div class="sw"><b class="on" style="background:#f1f0ec"></b><b style="background:#ebe3d4"></b><b style="background:#cfd0cc"></b><b style="background:#55585c"></b><b class="wheel"></b></div>
        <h3>Accent siding <span>Board &amp; batten · Charcoal</span></h3>
        <div class="sw"><b class="on" style="background:#767a80"></b><b style="background:#4f5256"></b><b style="background:#f0efeb"></b><b style="background:#9aa58f"></b><b class="wheel"></b></div>
        <h3>Roofing <span>Asphalt shingles · Charcoal</span></h3>
        <div class="sw"><b class="on" style="background:#45474a"></b><b style="background:#28292c"></b><b style="background:#6b5a49"></b><b class="wheel"></b></div>
      </div></div>
      <figcaption>Customize every color and texture to your liking.</figcaption>
    </figure>
  </section>
</main>
<script>
{ const v = document.getElementById('film');
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) v.controls = true;
  else new IntersectionObserver(([e]) => { if (e.isIntersecting) { v.preload = 'auto'; v.play().catch(() => { v.controls = true; }); } else v.pause(); }, { threshold: .35 }).observe(v); }
</script>

    <nav aria-label="Legal"><a href="https://arain.org/terms">Terms</a><a href="https://arain.org/privacy">Privacy</a></nav>
  </div>
</footer>

</body>
</html>
